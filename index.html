<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Studio — Markdown Notes</title>
<meta name="description" content="A simple and private Markdown editor in your browser. Write, convert, and manage notes from .md, .docx, and .pdf files. All data stays on your device.">
<meta name="theme-color" content="#FFFFFF">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:title" content="MD Studio — Markdown Notes">
<meta property="og:description" content="A simple and private Markdown editor in your browser. Write, convert, and manage notes from .md, .docx, and .pdf files.">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="MD Studio — Markdown Notes">
<meta property="twitter:description" content="A simple and private Markdown editor in your browser. Write, convert, and manage notes from .md, .docx, and .pdf files.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window['pdfjsLib']) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark-theme" disabled>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
<div id="app">

  <header>
    <div class="brand">
      <button id="sidebarToggle" aria-label="Toggle file list">☰</button>
      <svg class="logo" width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="30" height="30" rx="6" fill="var(--accent-primary)"/>
        <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-family="var(--mono)" font-size="14" font-weight="bold" fill="white">MD</text>
      </svg>
      <h1>MD Studio</h1>
    </div>
    <div class="top-actions">
      <button id="newBtn" class="btn"><span class="btn-label">New</span> +</button>
      <button id="uploadBtn" class="btn"><span class="btn-label">Import</span> ↑</button>
      <button id="downloadBtn" class="btn"><span class="btn-label">Export</span> ↓</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt,.docx,.pdf" multiple>
      <button id="themeToggle" aria-label="Toggle theme">
        <svg class="theme-icon" id="themeIconLight" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V18.75a.75.75 0 01.75-.75zM5.106 17.834a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 00-1.06-1.061l-1.591 1.59zM3 12a.75.75 0 01-.75.75H.75a.75.75 0 010-1.5h2.25A.75.75 0 013 12zM6.166 5.106a.75.75 0 00-1.06 1.06l1.59 1.591a.75.75 0 001.061-1.06l-1.59-1.591z"></path></svg>
        <svg class="theme-icon" id="themeIconDark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.463-.948a.75.75 0 01.98.641A11.25 11.25 0 0112 21a11.25 11.25 0 01-11.25-11.25 11.25 11.25 0 019.528-9.282z" clip-rule="evenodd"></path></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="scrim" id="scrim"></div>
    <aside id="sidebar">
      <div class="sidebar-head">
        <input type="search" id="searchInput" placeholder="Search notes…">
        <span id="fileCount"></span>
      </div>
      <div id="fileList"></div>
    </aside>

    <div id="workspace">
      <div id="welcome">
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <h2>Nothing open yet.</h2>
        <p>Start a new note, or import a .md, .docx, or .pdf file — it'll be converted to markdown automatically. Everything saves here automatically.</p>
        <button id="welcomeNew" class="btn btn-primary">New note +</button>
      </div>

      <div id="editorArea" style="display:none; flex:1; flex-direction:column; min-height:0;">
        <div class="ws-head">
          <input id="titleInput" placeholder="Untitled note" autocomplete="off">
          <div class="view-toggle">
            <button id="viewSplit" class="on">split</button>
            <button id="viewEdit">edit</button>
            <button id="viewPreview">preview</button>
          </div>
          <span class="save-state" id="saveState">saved</span>
        </div>
        <div class="panes">
          <div id="editorPane"><textarea id="mdInput" placeholder="# Start writing…" spellcheck="false"></textarea></div>
          <div id="previewPane"><div class="prose" id="previewOut"></div></div>
        </div>
        <div class="ws-foot">
          <span id="noteStats"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="dist/bundle.js"></script>

<div id="toastContainer"></div>
</body>
</html>
